site_name: Rex-EMoolator
site_description: Unofficial documentation of the Piklib/BlooMoo scripting engines and the Rex-EMoolator emulator.
site_url: https://patryk025.github.io/Rex-EMoolator/
repo_url: https://github.com/patryk025/Rex-EMoolator
repo_name: Rex-EMoolator
edit_uri: edit/main/docs/

docs_dir: docs
exclude_docs: |
  requirements.txt
not_in_nav: |
  compatibility-audit.md
  reverse-engineering/

theme:
  name: material
  language: pl
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Tryb jasny

extra_css:
  - assets/method-map/method-map.css

extra_javascript:
  - assets/method-map/method-map.js

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: pl
          name: Polski
          default: true
          build: true
          nav_translations:
            Strona główna: Strona główna
            Emulator: Emulator
            Stan gier: Stan gier
            Zrzuty ekranu: Zrzuty ekranu
            Łatki: Łatki
            Rozbieżności z oryginałem: Rozbieżności z oryginałem
            Budowanie i rozwój: Budowanie i rozwój
            Silnik: Silnik
            Skrypty: Skrypty
            Arytmetyka: Arytmetyka
            Zdarzenia i sygnały: Zdarzenia i sygnały
            Zmienne globalne: Zmienne globalne
            Dziwactwa silnika: Dziwactwa silnika
            Wnętrze silnika: Wnętrze silnika
            Architektura: Architektura
            Pętla i zegar silnika: Pętla i zegar silnika
            Renderowanie: Renderowanie
            Współrzędne i kotwice: Współrzędne i kotwice
            System animacji: System animacji
            Czas i timery: Czas i timery
            Formaty plików: Formaty plików
            Kompresja: Kompresja
            Szyfrowanie skryptów: Szyfrowanie skryptów
            Minigierki: Minigierki
            Pojedynek zaklęć: Pojedynek zaklęć
            Referencja typów: Referencja typów
            Mapa metod: Mapa metod
        - locale: en
          name: English
          build: true
          nav_translations:
            Strona główna: Home
            Emulator: Emulator
            Stan gier: Game status
            Zrzuty ekranu: Screenshots
            Łatki: Patches
            Rozbieżności z oryginałem: Differences from the original
            Budowanie i rozwój: Building and development
            Silnik: Engine
            Skrypty: Scripts
            Arytmetyka: Arithmetic
            Zdarzenia i sygnały: Events and signals
            Zmienne globalne: Global variables
            Dziwactwa silnika: Engine quirks
            Wnętrze silnika: Engine internals
            Architektura: Architecture
            Pętla i zegar silnika: Game loop & engine clock
            Renderowanie: Rendering
            Współrzędne i kotwice: Coordinates & anchors
            System animacji: Animation system
            Czas i timery: Time and timers
            Formaty plików: File formats
            Kompresja: Compression
            Szyfrowanie skryptów: Script encryption
            Minigierki: Minigames
            Pojedynek zaklęć: Spell duel
            Referencja typów: Type reference
            Mapa metod: Method map

nav:
