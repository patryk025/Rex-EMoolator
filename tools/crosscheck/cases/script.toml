# Whole behaviours returning a value: the scripts of debug/scripttest/Script_test.cnv,
# also core/tests/.../tests/CodeParserTest.java. Each behaviour is its own case,
# run once; the case records what RUN returns. PIKLIB 6.1 has no @ commands.

[defaults]
tags = ["script"]
read = ["TEST_VALUE_1"]
cnv = '''
OBJECT=TEST_NO
TEST_NO:TYPE=INTEGER
TEST_NO:VALUE=1

OBJECT=TEST_VALUE_1
TEST_VALUE_1:TYPE=INTEGER
TEST_VALUE_1:VALUE=5

OBJECT=TEST_VALUE_NAME
TEST_VALUE_NAME:TYPE=STRING
TEST_VALUE_NAME:VALUE=TEST_VALUE_1

OBJECT=EMPTY_TARGET
EMPTY_TARGET:TYPE=STRING
EMPTY_TARGET:VALUE=

OBJECT=TEST_STRUCT
TEST_STRUCT:TYPE=STRUCT
TEST_STRUCT:FIELDS=NAME<STRING>,VAL<INTEGER>

OBJECT=TEST_BEH
TEST_BEH:TYPE=BEHAVIOUR
TEST_BEH:CODE={@RETURN(2);}

OBJECT=EXPR_PRECEDENCE
EXPR_PRECEDENCE:TYPE=BEHAVIOUR
EXPR_PRECEDENCE:CODE={@RETURN([1+2*3]);}

OBJECT=EXPR_NESTED
EXPR_NESTED:TYPE=BEHAVIOUR
EXPR_NESTED:CODE={@RETURN([[10-3]*[2+1]]);}

OBJECT=EXPR_MODULO
EXPR_MODULO:TYPE=BEHAVIOUR
EXPR_MODULO:CODE={@RETURN([10%3]);}

OBJECT=EXPR_LEFT_TO_RIGHT
EXPR_LEFT_TO_RIGHT:TYPE=BEHAVIOUR
EXPR_LEFT_TO_RIGHT:CODE={@RETURN([2+2*2]);}

OBJECT=EXPR_DOUBLE
EXPR_DOUBLE:TYPE=BEHAVIOUR
EXPR_DOUBLE:CODE={@RETURN([1.2+2.3]);}

OBJECT=EXPR_LOCAL
EXPR_LOCAL:TYPE=BEHAVIOUR
EXPR_LOCAL:CODE={@INT("A", 5); @RETURN([A + 2]);}

OBJECT=RETURN_UNBALANCED_QUOTE
RETURN_UNBALANCED_QUOTE:TYPE=BEHAVIOUR
RETURN_UNBALANCED_QUOTE:CODE={@RETURN("ANNCAR0);}

OBJECT=IF3_LITERAL
IF3_LITERAL:TYPE=BEHAVIOUR
IF3_LITERAL:CODE={@STRING("TEST", "");@IF("1'1","{TEST^SET("OK");}","{TEST^SET("BAD");}");@RETURN(TEST);}

OBJECT=IF3_CALL
IF3_CALL:TYPE=BEHAVIOUR
IF3_CALL:CODE={@STRING("TEST", "");@IF("TEST_BEH^RUN()'2","{TEST^SET("OK");}","{TEST^SET("BAD");}");@RETURN(TEST);}

OBJECT=IF3_BEHAVIOUR_NAME
IF3_BEHAVIOUR_NAME:TYPE=BEHAVIOUR
IF3_BEHAVIOUR_NAME:CODE={@STRING("TEST", "");@IF("TEST_BEH'2","{TEST^SET("OK");}","{TEST^SET("BAD");}");@RETURN(TEST);}

OBJECT=IF5_LITERAL
IF5_LITERAL:TYPE=BEHAVIOUR
IF5_LITERAL:CODE={@STRING("TEST", "");@IF("1","_","1","{TEST^SET("OK");}","{TEST^SET("BAD");}");@RETURN(TEST);}

OBJECT=IF5_CALL
IF5_CALL:TYPE=BEHAVIOUR
IF5_CALL:CODE={@STRING("TEST", "");@IF("TEST_BEH^RUN()","_","2","{TEST^SET("OK");}","{TEST^SET("BAD");}");@RETURN(TEST);}

OBJECT=IF5_BEHAVIOUR_NAME
IF5_BEHAVIOUR_NAME:TYPE=BEHAVIOUR
IF5_BEHAVIOUR_NAME:CODE={@STRING("TEST", "");@IF("TEST_BEH","_","2","{TEST^SET("OK");}","{TEST^SET("BAD");}");@RETURN(TEST);}

OBJECT=IF5_CALL_UNQUOTED
IF5_CALL_UNQUOTED:TYPE=BEHAVIOUR
IF5_CALL_UNQUOTED:CODE={@STRING("TEST", "");@IF("TEST_BEH^RUN()","_",2,"{TEST^SET("OK");}","{TEST^SET("BAD");}");@RETURN(TEST);}

OBJECT=IF5_EXPRESSION
IF5_EXPRESSION:TYPE=BEHAVIOUR
IF5_EXPRESSION:CODE={@STRING("TEST", "");@IF("[TEST_VALUE_1+1]","_",6,"{TEST^SET("OK");}","{TEST^SET("BAD");}");@RETURN(TEST);}

OBJECT=INT_REDECLARE_SELF
INT_REDECLARE_SELF:TYPE=BEHAVIOUR
INT_REDECLARE_SELF:CODE={@INT("A",1);@INT("A",[A+1]);@RETURN(A);}

OBJECT=INT_REDECLARE
INT_REDECLARE:TYPE=BEHAVIOUR
INT_REDECLARE:CODE={@INT("A",1);@INT("A",2);@RETURN(A);}

OBJECT=INT_FROM_LOCAL
INT_FROM_LOCAL:TYPE=BEHAVIOUR
INT_FROM_LOCAL:CODE={@INT("A",1);@INT("B",[A+1]);@RETURN(B);}

OBJECT=LOOP_FIBONACCI_VARS
LOOP_FIBONACCI_VARS:TYPE=BEHAVIOUR
LOOP_FIBONACCI_VARS:CODE={@INT("A",0);@INT("B",1);@INT("I",2);@INT("N",10);@INT("TMP",0);@LOOP("{TMP^SET(B);B^SET([A+B]);A^SET(TMP);}",I,[N-I+1],1);@RETURN(B);}

OBJECT=LOOP_FIBONACCI
LOOP_FIBONACCI:TYPE=BEHAVIOUR
LOOP_FIBONACCI:CODE={@INT("A",0);@INT("B",1);@INT("TMP",0);@LOOP("{TMP^SET(B);B^SET([A+B]);A^SET(TMP);}",2,9,1);@RETURN(B);}

OBJECT=RETURN_THEN_SET
RETURN_THEN_SET:TYPE=BEHAVIOUR
RETURN_THEN_SET:CODE={@INT("B",0);@RETURN(B);B^SET(1);}

OBJECT=RETURN_TWICE
RETURN_TWICE:TYPE=BEHAVIOUR
RETURN_TWICE:CODE={@INT("B",0);@RETURN(B);B^SET(1);@RETURN(B);B^SET(2);}

OBJECT=RETURN_LOCAL_ABS
RETURN_LOCAL_ABS:TYPE=BEHAVIOUR
RETURN_LOCAL_ABS:CODE={@INT("B",-420);B^ABS(-420);@RETURN(B);}

OBJECT=POINTER_STRING
POINTER_STRING:TYPE=BEHAVIOUR
POINTER_STRING:CODE={@RETURN(*TEST_VALUE_NAME^GET());}

OBJECT=POINTER_EXPRESSION
POINTER_EXPRESSION:TYPE=BEHAVIOUR
POINTER_EXPRESSION:CODE={@RETURN(*["TEST_VALUE_"+TEST_NO]^GET());}

OBJECT=POINTER_MISSING
POINTER_MISSING:TYPE=BEHAVIOUR
POINTER_MISSING:CODE={@RETURN(*["TEST_VALUE_"+TEST_NO+1]^GET());}

OBJECT=POINTER_SET_ARGUMENT
POINTER_SET_ARGUMENT:TYPE=BEHAVIOUR
POINTER_SET_ARGUMENT:CODE={*TEST_VALUE_NAME^SET([TEST_BEH^RUN()+5]);@RETURN(TEST_VALUE_1);}

OBJECT=POINTER_EMPTY
POINTER_EMPTY:TYPE=BEHAVIOUR
POINTER_EMPTY:CODE={*EMPTY_TARGET^SET(99);@RETURN(TEST_VALUE_1);}

OBJECT=STRUCT_FIELD_SET
STRUCT_FIELD_SET:TYPE=BEHAVIOUR
STRUCT_FIELD_SET:CODE={TEST_STRUCT|VAL^SET(9);@RETURN(TEST_STRUCT|VAL);}
'''

[[case]]
id = "script.expression.${b}"
description = "@RETURN of a bracket expression."
each.b = ["EXPR_PRECEDENCE", "EXPR_NESTED", "EXPR_MODULO", "EXPR_LEFT_TO_RIGHT", "EXPR_DOUBLE", "EXPR_LOCAL"]
steps = ["${b}^RUN()"]

[[case]]
id = "script.return.${b}"
description = "@RETURN only sets the value (code after it still runs; a later @RETURN wins), and its odd arguments."
each.b = ["RETURN_THEN_SET", "RETURN_TWICE", "RETURN_LOCAL_ABS", "RETURN_UNBALANCED_QUOTE"]
steps = ["${b}^RUN()"]

[[case]]
id = "script.if.${b}"
description = "Three- and five-argument @IF on literals, calls, behaviour names and expressions."
each.b = ["IF3_LITERAL", "IF3_CALL", "IF3_BEHAVIOUR_NAME", "IF5_LITERAL", "IF5_CALL", "IF5_BEHAVIOUR_NAME", "IF5_CALL_UNQUOTED", "IF5_EXPRESSION"]
steps = ["${b}^RUN()"]

[[case]]
id = "script.local.${b}"
description = "Redeclaring a local with @INT, and one local initialised from another."
each.b = ["INT_REDECLARE_SELF", "INT_REDECLARE", "INT_FROM_LOCAL"]
steps = ["${b}^RUN()"]

[[case]]
id = "script.loop.${b}"
description = "Fibonacci through @LOOP, with the bounds as locals and as literals."
each.b = ["LOOP_FIBONACCI_VARS", "LOOP_FIBONACCI"]
steps = ["${b}^RUN()"]

[[case]]
id = "script.pointer.${b}"
description = "*name and *[expression] targets, a missing and an empty one, and a STRUCT field as a target."
each.b = ["POINTER_STRING", "POINTER_EXPRESSION", "POINTER_MISSING", "POINTER_SET_ARGUMENT", "POINTER_EMPTY", "STRUCT_FIELD_SET"]
steps = ["${b}^RUN()"]
