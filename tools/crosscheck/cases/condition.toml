# Compound @IF conditions: precedence of && and ||, short-circuiting, arithmetic
# with and without brackets, comparisons, calls and their order, and '?' (type
# test). Taken from core/tests/.../tests/IfConditionTest.java. Each condition is
# a behaviour returning "TRUE" or "FALSE"; T, F and the counter behaviour leave
# a trace in TEST_RESULTS, so the order of evaluation shows in the state.
#
# The branches set a STRING and @RETURN comes after @IF, as in
# debug/scripttest/Script_test.cnv: an @RETURN inside an inline {...} branch
# takes every engine down here (see condition.return-inside-branch).

[defaults]
tags = ["condition"]
read = ["TEST_RESULTS", "LICZNIK", "OBJ"]
cnv = '''
OBJECT=LICZNIK
LICZNIK:TYPE=INTEGER
LICZNIK:VALUE=0

OBJECT=OBJ
OBJ:TYPE=INTEGER
OBJ:VALUE=2

OBJECT=OBJ2
OBJ2:TYPE=STRING
OBJ2:VALUE=1

OBJECT=TEST_RESULTS
TEST_RESULTS:TYPE=STRING
TEST_RESULTS:VALUE=

OBJECT=T
T:TYPE=BEHAVIOUR
T:CODE={TEST_RESULTS^ADD($1);@INT("RET",1);@RETURN(RET);}

OBJECT=F
F:TYPE=BEHAVIOUR
F:CODE={TEST_RESULTS^ADD($1);@INT("RET",0);@RETURN(RET);}

OBJECT=METODA_ZMIENIAJACA_LICZNIK
METODA_ZMIENIAJACA_LICZNIK:TYPE=BEHAVIOUR
METODA_ZMIENIAJACA_LICZNIK:CODE={LICZNIK^INC();TEST_RESULTS^ADD("v");@RETURN(LICZNIK);}

OBJECT=RETURN_INSIDE_BRANCH
RETURN_INSIDE_BRANCH:TYPE=BEHAVIOUR
RETURN_INSIDE_BRANCH:CODE={@IF("1'1","{@RETURN("TRUE");}","{@RETURN("FALSE");}");}

OBJECT=PRECEDENCE_1
PRECEDENCE_1:TYPE=BEHAVIOUR
PRECEDENCE_1:CODE={@STRING("TEST","");@IF("1'1||1'2&&1'2","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=PRECEDENCE_2
PRECEDENCE_2:TYPE=BEHAVIOUR
PRECEDENCE_2:CODE={@STRING("TEST","");@IF("1'1||1'1&&1'2","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=PRECEDENCE_3
PRECEDENCE_3:TYPE=BEHAVIOUR
PRECEDENCE_3:CODE={@STRING("TEST","");@IF("1'2&&1'1||1'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=PRECEDENCE_4
PRECEDENCE_4:TYPE=BEHAVIOUR
PRECEDENCE_4:CODE={@STRING("TEST","");@IF("1'2||1'1&&1'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=SHORT_OR_TRUE
SHORT_OR_TRUE:TYPE=BEHAVIOUR
SHORT_OR_TRUE:CODE={@STRING("TEST","");@IF("1'1||METODA_ZMIENIAJACA_LICZNIK^RUN()'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=SHORT_AND_FALSE
SHORT_AND_FALSE:TYPE=BEHAVIOUR
SHORT_AND_FALSE:CODE={@STRING("TEST","");@IF("1'2&&METODA_ZMIENIAJACA_LICZNIK^RUN()'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=SHORT_OR_FALSE
SHORT_OR_FALSE:TYPE=BEHAVIOUR
SHORT_OR_FALSE:CODE={@STRING("TEST","");@IF("1'2||METODA_ZMIENIAJACA_LICZNIK^RUN()'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=SHORT_AND_TRUE
SHORT_AND_TRUE:TYPE=BEHAVIOUR
SHORT_AND_TRUE:CODE={@STRING("TEST","");@IF("1'1&&METODA_ZMIENIAJACA_LICZNIK^RUN()'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=ARITHMETIC_20
ARITHMETIC_20:TYPE=BEHAVIOUR
ARITHMETIC_20:CODE={@STRING("TEST","");@IF("2+3*4'20&&1'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=ARITHMETIC_14
ARITHMETIC_14:TYPE=BEHAVIOUR
ARITHMETIC_14:CODE={@STRING("TEST","");@IF("2+3*4'14&&1'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=BRACKET_20
BRACKET_20:TYPE=BEHAVIOUR
BRACKET_20:CODE={@STRING("TEST","");@IF("[2+3*4]'20&&1'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=BRACKET_14
BRACKET_14:TYPE=BEHAVIOUR
BRACKET_14:CODE={@STRING("TEST","");@IF("[2+3*4]'14&&1'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=ARITHMETIC_MIXED
ARITHMETIC_MIXED:TYPE=BEHAVIOUR
ARITHMETIC_MIXED:CODE={@STRING("TEST","");@IF("5+5*2'20||1'2&&1'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=TEXT_4
TEXT_4:TYPE=BEHAVIOUR
TEXT_4:CODE={@STRING("TEST","");@IF("2+2'4","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=TEXT_2
TEXT_2:TYPE=BEHAVIOUR
TEXT_2:CODE={@STRING("TEST","");@IF("2+2'2","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=TEXT_QUOTED
TEXT_QUOTED:TYPE=BEHAVIOUR
TEXT_QUOTED:CODE={@STRING("TEST","");@IF("2+2'"2+2"","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=COMPARE_1
COMPARE_1:TYPE=BEHAVIOUR
COMPARE_1:CODE={@STRING("TEST","");@IF("10>'5&&3<'10||1'2","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=COMPARE_2
COMPARE_2:TYPE=BEHAVIOUR
COMPARE_2:CODE={@STRING("TEST","");@IF("5!'5||8>'10&&1'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=COMPARE_3
COMPARE_3:TYPE=BEHAVIOUR
COMPARE_3:CODE={@STRING("TEST","");@IF("1'1&&2<'3||4>'5","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=CALL_GET
CALL_GET:TYPE=BEHAVIOUR
CALL_GET:CODE={@STRING("TEST","");@IF("OBJ^GET()'42&&1'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=CALL_SET_SKIPPED
CALL_SET_SKIPPED:TYPE=BEHAVIOUR
CALL_SET_SKIPPED:CODE={@STRING("TEST","");@IF("1'1||OBJ^SET(999)'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=CALL_BOTH_SIDES
CALL_BOTH_SIDES:TYPE=BEHAVIOUR
CALL_BOTH_SIDES:CODE={@STRING("TEST","");@IF("OBJ^GET()'OBJ2^GET()&&1'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=COMPLEX_1
COMPLEX_1:TYPE=BEHAVIOUR
COMPLEX_1:CODE={@STRING("TEST","");@IF("1'1||1'2&&1'3||1'4","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=COMPLEX_2
COMPLEX_2:TYPE=BEHAVIOUR
COMPLEX_2:CODE={@STRING("TEST","");@IF("1'2&&1'3||1'4&&1'5","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=ORDER_OR
ORDER_OR:TYPE=BEHAVIOUR
ORDER_OR:CODE={@STRING("TEST","");@IF("T^RUN("A")'1||T^RUN("B")'1||T^RUN("C")'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=ORDER_AND
ORDER_AND:TYPE=BEHAVIOUR
ORDER_AND:CODE={@STRING("TEST","");@IF("F^RUN("A")'0&&F^RUN("B")'0&&F^RUN("C")'0","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=ORDER_OR_SECOND
ORDER_OR_SECOND:TYPE=BEHAVIOUR
ORDER_OR_SECOND:CODE={@STRING("TEST","");@IF("F^RUN("A")'0||T^RUN("B")'1||T^RUN("C")'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=ORDER_AND_MIXED
ORDER_AND_MIXED:TYPE=BEHAVIOUR
ORDER_AND_MIXED:CODE={@STRING("TEST","");@IF("T^RUN("A")'1&&F^RUN("B")'0&&T^RUN("C")'1","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=INSTANCEOF
INSTANCEOF:TYPE=BEHAVIOUR
INSTANCEOF:CODE={@STRING("TEST","");@IF("OBJ?INTEGER","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}

OBJECT=INSTANCEOF_STRING
INSTANCEOF_STRING:TYPE=BEHAVIOUR
INSTANCEOF_STRING:CODE={@STRING("TEST","");@IF("OBJ?"INTEGER"","{TEST^SET("TRUE");}","{TEST^SET("FALSE");}");@RETURN(TEST);}
'''

[[case]]
id = "condition.${b}"
each.b = ["PRECEDENCE_1", "PRECEDENCE_2", "PRECEDENCE_3", "PRECEDENCE_4", "SHORT_OR_TRUE", "SHORT_AND_FALSE", "SHORT_OR_FALSE", "SHORT_AND_TRUE", "ARITHMETIC_20", "ARITHMETIC_14", "BRACKET_20", "BRACKET_14", "ARITHMETIC_MIXED", "TEXT_4", "TEXT_2", "TEXT_QUOTED", "COMPARE_1", "COMPARE_2", "COMPARE_3", "CALL_GET", "CALL_SET_SKIPPED", "CALL_BOTH_SIDES", "COMPLEX_1", "COMPLEX_2", "ORDER_OR", "ORDER_AND", "ORDER_OR_SECOND", "ORDER_AND_MIXED", "INSTANCEOF", "INSTANCEOF_STRING"]
steps = ["${b}^RUN()"]

[[case]]
id = "condition.return-inside-branch"
description = "The form IfConditionTest uses: @RETURN inside an inline @IF branch. Crashes in ~CMC_Behaviour (the temporary branch behaviour) on PIKLIB 7.2/8 and BlooMoo under pikhost; not yet confirmed in a game."
steps = ["RETURN_INSIDE_BRANCH^RUN()"]
